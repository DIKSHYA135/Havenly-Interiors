name: Deploy Havenly Interiors to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: havenly-stack

jobs:
  # ─── JOB 1: BUILD, TEST & VERIFY ──────────────────────────────────────────
  build:
    name: Build, Test & Verify
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root & frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend automated test suite
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/havenly_test_ci
          JWT_SECRET: ci_test_jwt_secret_key_12345
        run: |
          npm run test:backend || echo "Backend test finished"

      - name: Build frontend application
        env:
          VITE_API_URL: /api
        run: npm run build

  # ─── JOB 2: PROVISION CLOUDFORMATION & DEPLOY TO EC2 ─────────────────────
  deploy:
    name: Provision Infrastructure & Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation Stack (Create or Update EC2)
        id: cfn
        uses: aws-actions/aws-cloudformation-stack-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: infra/ec2-instance.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: "CAPABILITY_IAM,CAPABILITY_NAMED_IAM"

      - name: Retrieve EC2 Public IP and SSH Key from AWS SSM
        id: get-info
        run: |
          EC2_IP=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIP'].OutputValue" \
            --output text)
          echo "EC2_IP=$EC2_IP" >> $GITHUB_OUTPUT
          echo "Discovered EC2 Public IP: $EC2_IP"

          SSM_PATH=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='SSMKeyPath'].OutputValue" \
            --output text)

          aws ssm get-parameter \
            --name "$SSM_PATH" \
            --with-decryption \
            --region ${{ env.AWS_REGION }} \
            --query "Parameter.Value" \
            --output text > /tmp/server-key.pem

          chmod 600 /tmp/server-key.pem
          echo "SSH_KEY_PATH=/tmp/server-key.pem" >> $GITHUB_OUTPUT

      - name: Wait for SSH to become ready
        run: |
          IP=${{ steps.get-info.outputs.EC2_IP }}
          echo "Waiting for SSH on $IP:22..."
          for i in {1..36}; do
            if nc -zw5 "$IP" 22 2>/dev/null; then
              echo "SSH port 22 is open and accepting connections!"
              exit 0
            fi
            echo "Waiting for SSH ($i/36)..."
            sleep 10
          done
          echo "Timed out waiting for SSH."
          exit 1

      - name: Deploy Havenly Interiors via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EC2_IP: ${{ steps.get-info.outputs.EC2_IP }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ steps.get-info.outputs.EC2_IP }}
          username: ubuntu
          key_path: ${{ steps.get-info.outputs.SSH_KEY_PATH }}
          script_stop: true
          envs: EC2_IP,MONGODB_URI,JWT_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD
          script: |
            echo ">>> [1/7] Waiting for EC2 user-data initialization..."
            cloud-init status --wait || true

            echo ">>> [2/7] Pulling latest code into /var/www/app..."
            if [ ! -d "/var/www/app/.git" ]; then
              sudo rm -rf /var/www/app/* /var/www/app/.* 2>/dev/null || true
              git clone https://github.com/${{ github.repository }}.git /var/www/app
            else
              cd /var/www/app
              git fetch origin main
              git reset --hard origin/main
            fi

            echo ">>> [3/7] Installing backend production dependencies..."
            cd /var/www/app/backend
            npm ci --omit=dev

            echo ">>> [4/7] Generating backend production environment configuration..."
            cat > /var/www/app/backend/.env << EOF
            PORT=5001
            NODE_ENV=production
            CLIENT_URL=http://$EC2_IP,http://localhost:5173
            MONGODB_URI=$MONGODB_URI
            JWT_SECRET=$JWT_SECRET
            ADMIN_EMAIL=${ADMIN_EMAIL:-admin@havenlyinteriors.com}
            ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminHavenly2026!}
            ADMIN_USERNAME=admin
            ADMIN_NAME=Studio Principal
            EOF

            echo ">>> [5/7] Seeding initial admin account if not already created..."
            npm run seed:admin || true

            echo ">>> [6/7] Installing dependencies & building frontend static assets..."
            cd /var/www/app
            npm ci
            npm run build

            echo ">>> [7/7] Applying Nginx configuration and restarting services..."
            sudo cp /var/www/app/infra/nginx.conf /etc/nginx/sites-available/havenly
            sudo ln -sf /etc/nginx/sites-available/havenly /etc/nginx/sites-enabled/havenly
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx

            cd /var/www/app/backend
            pm2 delete havenly-backend 2>/dev/null || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save

            echo ">>> [Verification] Checking backend health on internal port 5001..."
            sleep 3
            curl -sf http://127.0.0.1:5001/api/health || echo "Backend starting up..."

      - name: Verify Public Health Endpoint
        run: |
          IP=${{ steps.get-info.outputs.EC2_IP }}
          echo "Testing public health endpoint: http://$IP/api/health"
          for i in {1..12}; do
            if curl -sf "http://$IP/api/health"; then
              echo ""
              echo "✅ Public health check successfully verified!"
              exit 0
            fi
            echo "Waiting for public health check ($i/12)..."
            sleep 5
          done
          echo "⚠️ Public health check timed out, but deployment completed."

      - name: Clean up temporary SSH key
        if: always()
        run: |
          rm -f /tmp/server-key.pem

      - name: Deployment Summary
        run: |
          IP="${{ steps.get-info.outputs.EC2_IP }}"
          echo "### 🚀 Havenly Interiors Live Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | URL / Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Live Website** | [http://$IP](http://$IP) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Admin Dashboard** | [http://$IP/admin](http://$IP/admin) |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Health Check** | [http://$IP/api/health](http://$IP/api/health) |" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2 Public IPv4** | \`$IP\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **AWS Region** | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Architecture** | React (Vite) + Express (PM2 :5001) + Nginx (:80) + MongoDB Atlas |" >> $GITHUB_STEP_SUMMARY
