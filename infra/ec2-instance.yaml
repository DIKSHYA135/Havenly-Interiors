AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Havenly Interiors Full-Stack Production Infrastructure.
  Provisions an Ubuntu 24.04 LTS EC2 instance with Nginx, Node.js 22, PM2,
  a Security Group (HTTP/HTTPS/SSH), and an auto-generated SSH KeyPair stored
  in AWS Systems Manager Parameter Store.

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
    Description: >-
      EC2 instance type. t2.micro and t3.micro are AWS Free Tier eligible
      (750 hours/month for the first 12 months).

  UbuntuAMI:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
    Description: >-
      Automatically resolves the latest official Ubuntu 24.04 LTS AMI
      in whatever AWS region the stack is launched in.

  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
    ConstraintDescription: Must be a valid CIDR block (e.g. 203.0.113.0/24 or 0.0.0.0/0).
    Description: >-
      CIDR block allowed to SSH into the instance. Default 0.0.0.0/0 is
      required for GitHub Actions runners (dynamic IPs). For tighter security,
      restrict to your known IP range after initial deployment.

Resources:
  # ----------------------------------------------------------------------------
  # 1. SSH KeyPair — private key auto-saved to SSM Parameter Store
  # ----------------------------------------------------------------------------
  ServerKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${AWS::StackName}-key"

  # ----------------------------------------------------------------------------
  # 2. Security Group — only the ports that are needed
  # ----------------------------------------------------------------------------
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        Havenly Interiors web server security group.
        Port 80 (HTTP) and 443 (HTTPS) are open to the public.
        Port 22 (SSH) is restricted to the SSHLocation CIDR.
        Port 5001 (Express) is NOT exposed; Nginx reverse-proxies internally.
      SecurityGroupIngress:
        # HTTP — public web traffic
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        # HTTPS — public secure web traffic
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        # SSH — deployment & maintenance access only
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  # ----------------------------------------------------------------------------
  # 3. EC2 Instance — Ubuntu 24.04 with automated bootstrap
  # ----------------------------------------------------------------------------
  ServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref ServerKeyPair
      SecurityGroupIds:
        - !GetAtt ServerSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-server"
        - Key: Application
          Value: HavenlyInteriors
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/userdata.log 2>&1

          echo ">>> [1/5] Updating system packages and installing Node.js 22 LTS, Git, Nginx..."
          apt-get update -y
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs nginx git curl

          echo ">>> [2/5] Installing PM2 process manager globally..."
          npm install -g pm2

          echo ">>> [3/5] Creating web application directory..."
          mkdir -p /var/www/app
          chown -R ubuntu:ubuntu /var/www/app

          echo ">>> [4/5] Enabling and starting Nginx..."
          systemctl enable nginx
          systemctl start nginx

          echo ">>> [5/5] Configuring PM2 startup service for ubuntu user..."
          sudo -u ubuntu bash -c 'pm2 startup systemd -u ubuntu --hp /home/ubuntu 2>/dev/null | grep "sudo" | bash' || true

          echo ">>> EC2 instance initialization complete."

Outputs:
  PublicIP:
    Description: Public IPv4 address of the EC2 instance
    Value: !GetAtt ServerInstance.PublicIp

  PublicURL:
    Description: Live website URL
    Value: !Sub "http://${ServerInstance.PublicIp}"

  SSMKeyPath:
    Description: SSM Parameter Store path for the private SSH key
    Value: !Sub "/ec2/keypair/${ServerKeyPair.KeyPairId}"

  SecurityGroupId:
    Description: Security Group ID
    Value: !GetAtt ServerSecurityGroup.GroupId
