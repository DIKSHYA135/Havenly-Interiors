server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25M;

    # 1. FRONTEND: Serve compiled React/Vite static files from dist
    root /var/www/app/dist;
    index index.html;

    # SPA routing fallback: prevents 404 errors when refreshing pages
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND API: Reverse proxy requests to Express on internal port 5001
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. UPLOADS: Serve uploaded media/images
    # '^~' gives priority so static regex caching does not intercept it
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. STATIC CACHING: Speeds up CSS, JS, fonts, and images
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
